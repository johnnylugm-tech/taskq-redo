# TEST_INVENTORY.yaml — P1 Naming Authority
# Maps every FR/NFR AC to an independent test case entry. These are the
# AUTHORITATIVE names that derive_test_cases.md preserves in TEST_SPEC.md
# (P2 single source of truth). One tc_id per AC — range syntax in the
# traceability matrix is documentation shorthand and is expanded here.
format_version: "1.1"

# ── test_inventory ────────────────────────────────────────────────────────
# Each entry carries:
#   tc_id          the matrix id, one entry per AC id — never a range
#   fr / nfr       the requirement this test primarily verifies (exactly
#                  one of them; cross-cutting coverage is signalled via
#                  cross_ref_frs / cross_ref_nfrs metadata, not deletion)
#   ac             the acceptance criterion id (e.g. AC-1.3, AC-N2.4)
#   layer          unit | static | integration | e2e | performance
#   test_function  the name, identical to TEST_SPEC.md's `Test Function` cell
#   test_file      where it will live
test_inventory:
  tests:
