# Alembic configuration for taskq-api (SPEC §3 FR-07 — three revisions: v1, v2, v3).
# migrations/versions/v1_initial.py — tasks + api_keys
# migrations/versions/v2_tags.py     — tags + task_tags + unique name
# migrations/versions/v3_split_results.py — data move tasks.result_json → task_results

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///./taskq.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
